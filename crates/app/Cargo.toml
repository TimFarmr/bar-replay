[package]
name = "bar-replay-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
replay-core = { path = "../core" }
replay-data = { path = "../data" }
replay-engine = { path = "../engine" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The desktop shell (ADR 0002). MIT/Apache-2.0.
tauri = { version = "2", features = [] }
# Native file picker for CSV import. Replaces asking a non-technical trader to
# type a filesystem path, which the zero-friction rule rules out. MIT.
rfd = "0.15"
