name: ci
on: [push, pull_request]

env:
  # DuckDB is a very large C++ amalgamation. Its debug symbols, not its code,
  # are what fill a hosted runner's disk, and a pass/fail run has no use for
  # them. This is the single biggest lever on CI disk and build time.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        # Even without debug symbols the DuckDB build is tight against the
        # ~14 GB a hosted runner starts with. None of these preinstalled
        # toolchains are used by this project.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/graalvm /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      # Tauri needs the system webview and its build dependencies on Linux.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The Tauri crate embeds ui/dist, so the frontend is built first.
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The no-lookahead property test runs 8000 queries; allow it the time.
      - run: cargo test --workspace
        timeout-minutes: 45

      - name: Disk space after build
        if: always()
        run: df -h / | tail -1
